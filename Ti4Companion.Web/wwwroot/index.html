<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TI4 Companion" />
    <title>Twilight Imperium Companion</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Clients that ignore the declared icon probe /favicon.ico directly (iOS, feed readers, crawlers) -->
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link href="Ti4Companion.Web.styles.css" rel="stylesheet" />
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // ---- Boot watchdog ---------------------------------------------------------------------------
        // A Blazor boot that stalls leaves the loading screen above on screen and says NOTHING, which is
        // exactly how a "the first visit just hangs, F5 fixes it" report is born — and such a report is
        // unfixable, because it names no cause. So: collect what went wrong, and if the boot screen is
        // still up after 8 seconds, put the state on the screen. Loaded before the framework, so the
        // handlers catch errors from the boot itself.
        window.ti4boot = { errors: [] };
        addEventListener('error', function (e) {
            window.ti4boot.errors.push((e.message || 'error') + ' @ ' + ((e.filename || '?').split('/').pop()));
        }, true);
        addEventListener('unhandledrejection', function (e) {
            var r = e.reason;
            window.ti4boot.errors.push('promise: ' + ((r && (r.message || r)) || '?'));
        });
        setTimeout(function () {
            var app = document.getElementById('app');
            if (!app || !app.querySelector('.loading-progress')) return;   // it booted; nothing to report
            var pct = getComputedStyle(document.documentElement).getPropertyValue('--blazor-load-percentage');
            var res = performance.getEntriesByType('resource');
            var pending = res.filter(function (r) { return r.responseEnd === 0; });
            var box = document.createElement('div');
            box.className = 'boot-stuck';
            box.innerHTML = '<b>Still starting…</b><br>' +
                'loaded ' + (pct || '?').trim() + ' · ' + res.length + ' files, ' + pending.length + ' still pending' +
                (pending.length ? '<br>waiting on: ' + pending.slice(0, 3).map(function (r) { return r.name.split('/').pop(); }).join(', ') : '') +
                (window.ti4boot.errors.length ? '<br>' + window.ti4boot.errors.slice(0, 3).join('<br>') : '') +
                '<br><br><a href="javascript:location.reload()">Reload</a>';
            app.appendChild(box);
        }, 8000);
    </script>
    <script>
        // Wall-display helper: flow the tech cards into balanced columns; while a column flow overflows its
        // height, collapse the lowest-prerequisite tech to just its name (top-down, one at a time) until it
        // fits. Reset (uncollapse) first so removing techs re-expands the cards. Purely visual (CSS classes).
        window.ti4 = window.ti4 || {};
        // ---- "a new version is waiting" -------------------------------------------------------------
        // The published service worker answers every navigation out of its cache and does NOT call
        // skipWaiting, so after a deploy a reload keeps serving the OLD app until every tab of the origin is
        // closed. That is the right default — a running game must not have its files pulled out from under
        // it — but it needs to be VISIBLE, hence the bar the app shows from these two hooks.
        window.ti4.update = {
            waiting: false,
            onFound: null,
            /// Registers the .NET callback and reports whether an update is already waiting.
            watch: function (dotNet) {
                window.ti4.update.onFound = function () { dotNet.invokeMethodAsync('Found'); };
                return window.ti4.update.waiting;
            },
            /// Hand over to the waiting worker and come back on the new files. Only ever called because the
            /// user tapped "reload": activating clears the old cache, so it must be their decision.
            /// Returns false when the hand-over did NOT happen — then reloading is pointless and the app says
            /// what does work instead. That is not a rare case: a worker deployed BEFORE this message existed
            /// cannot answer it, so the very first update after this change always lands here.
            apply: async function () {
                try {
                    const reg = await navigator.serviceWorker.getRegistration();
                    if (reg && reg.waiting) {
                        const switched = new Promise(function (resolve) {
                            navigator.serviceWorker.addEventListener('controllerchange',
                                function () { resolve(true); }, { once: true });
                            setTimeout(function () { resolve(false); }, 2500);
                        });
                        reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                        if (await switched) { location.reload(); return true; }
                        return false;
                    }
                } catch (e) { /* fall through */ }
                location.reload();
                return true;
            }
        };
        // Resolves once the page is fully loaded and one frame has been painted. Used by the start page's
        // senate backdrop: ~150 pods with 24 photographs must never be laid out while the browser is still
        // pulling the app down, or the very first visit pays for decoration before it gets a page.
        // ⚠️ The frame is RACED against a timer, never awaited on its own: in a tab that is not visible —
        // opened in the background, or restored on startup — requestAnimationFrame never fires at all
        // (verified: no callback within 1.2s while document.visibilityState was 'hidden'), so anything that
        // waits for it simply never happens.
        window.ti4.afterLoad = function () {
            return new Promise(function (resolve) {
                var done = false;
                var finish = function () { if (!done) { done = true; resolve(true); } };
                var go = function () { requestAnimationFrame(finish); setTimeout(finish, 300); };
                if (document.readyState === 'complete') { go(); }
                else { addEventListener('load', go, { once: true }); }
            });
        };
        // Copy text to the clipboard SYNCHRONOUSLY within the user gesture. Called via Blazor's
        // in-process (synchronous) JS interop — Safari/iPad discards async clipboard calls once the
        // click gesture has "expired", which the normal awaited interop roundtrip triggers. Falls back
        // to the legacy textarea+execCommand trick where navigator.clipboard is unavailable (e.g.
        // plain-HTTP LAN play) or throws. Returns true when a copy was performed.
        window.ti4.copyText = function (text) {
            try {
                if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
                    // Called inside the gesture, so Safari accepts it; result promise is fire-and-forget.
                    navigator.clipboard.writeText(text).catch(function () { });
                    return true;
                }
            } catch (e) { /* fall through to the legacy path */ }
            try {
                var ta = document.createElement('textarea');
                ta.value = text;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select(); ta.setSelectionRange(0, text.length);
                var ok = document.execCommand('copy');
                document.body.removeChild(ta);
                return ok;
            } catch (e) { return false; }
        };
        // Drag-to-reorder for the seat-order dialog. Pointer events, NOT the HTML5 drag events: those
        // don't fire on touch, and the table's control device is an iPad. The helper only reports which
        // row the pointer is over — Blazor keeps owning the DOM and re-renders the preview order, so we
        // never move nodes behind its back (which would desync its diff).
        window.ti4.seatDrag = function (container, dotNet) {
            if (!container) return null;
            let active = false;
            var idxOf = function (el) {
                var row = el && el.closest ? el.closest('[data-seat-idx]') : null;
                return row ? parseInt(row.dataset.seatIdx, 10) : -1;
            };
            var down = function (e) {
                // Only the grip starts a drag. Listening on the whole row meant the preventDefault()
                // below swallowed the click on the ▲▼ buttons inside it, so they did nothing.
                if (!(e.target && e.target.closest && e.target.closest('[data-seat-grip]'))) return;
                var i = idxOf(e.target);
                if (i < 0) return;
                active = true;
                // Capture on the container so moves keep coming once the finger leaves the row.
                try { container.setPointerCapture(e.pointerId); } catch (err) { }
                dotNet.invokeMethodAsync('DragStart', i);
                e.preventDefault();
            };
            var move = function (e) {
                if (!active) return;
                var j = idxOf(document.elementFromPoint(e.clientX, e.clientY));
                if (j >= 0) dotNet.invokeMethodAsync('DragOver', j);
                e.preventDefault();
            };
            var up = function (e) {
                if (!active) return;
                active = false;
                try { container.releasePointerCapture(e.pointerId); } catch (err) { }
                dotNet.invokeMethodAsync('DragEnd');
            };
            container.addEventListener('pointerdown', down);
            container.addEventListener('pointermove', move);
            container.addEventListener('pointerup', up);
            container.addEventListener('pointercancel', up);
            return {
                dispose: function () {
                    container.removeEventListener('pointerdown', down);
                    container.removeEventListener('pointermove', move);
                    container.removeEventListener('pointerup', up);
                    container.removeEventListener('pointercancel', up);
                }
            };
        };
        // Turn timer ran out: a short buzz on the player's own device. Vibration is unsupported on iOS
        // Safari and requires a prior user gesture elsewhere, so failure is normal and ignored.
        window.ti4.buzz = function () {
            try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) { }
        };
        // ---- Web Push ("you're up") -------------------------------------------------------------
        // The notification itself is shown by the service worker (see service-worker*.js); this part only
        // deals with the browser's subscription. Every call answers rather than throws, so the UI can
        // explain what is wrong instead of failing silently.
        window.ti4.push = {
            supported: function () {
                return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
            },
            // iOS grants Web Push ONLY to a PWA installed on the home screen (Safari 16.4+). Report it so
            // the UI can say so, rather than showing a switch that does nothing when tapped.
            standalone: function () {
                try {
                    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
                } catch (e) { return false; }
            },
            isApple: function () {
                return /iPad|iPhone|iPod/.test(navigator.userAgent)
                    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            },
            permission: function () {
                try { return window.Notification ? Notification.permission : 'unsupported'; }
                catch (e) { return 'unsupported'; }
            },
            // Endpoint of the subscription this browser already has, or null.
            current: async function () {
                try {
                    const reg = await navigator.serviceWorker.getRegistration();
                    if (!reg || !reg.pushManager) return null;
                    const sub = await reg.pushManager.getSubscription();
                    return sub ? sub.endpoint : null;
                } catch (e) { return null; }
            },
            subscribe: async function (publicKey) {
                try {
                    const perm = await Notification.requestPermission();
                    if (perm !== 'granted') return { error: perm };
                    const reg = await navigator.serviceWorker.ready;
                    let sub = await reg.pushManager.getSubscription();
                    if (!sub) {
                        sub = await reg.pushManager.subscribe({
                            userVisibleOnly: true,          // required by Chrome, and honest: we always show one
                            applicationServerKey: b64ToBytes(publicKey)
                        });
                    }
                    const j = sub.toJSON();
                    return { endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth };
                } catch (e) { return { error: (e && e.message) || 'failed' }; }
            },
            unsubscribe: async function () {
                try {
                    const reg = await navigator.serviceWorker.getRegistration();
                    const sub = reg && reg.pushManager ? await reg.pushManager.getSubscription() : null;
                    if (!sub) return null;
                    const endpoint = sub.endpoint;
                    await sub.unsubscribe();
                    return endpoint;
                } catch (e) { return null; }
            }
        };
        // applicationServerKey wants raw bytes, and the key travels as base64url.
        function b64ToBytes(base64url) {
            const pad = '='.repeat((4 - base64url.length % 4) % 4);
            const raw = atob((base64url + pad).replace(/-/g, '+').replace(/_/g, '/'));
            const out = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
            return out;
        }
        window.ti4.fitTechCols = function () {
            document.querySelectorAll('.beamer .tech-col, .beamer .tech-unit-row').forEach(function (col) {
                col.querySelectorAll('.tech-item.collapsed').forEach(function (it) { it.classList.remove('collapsed'); });
                var guard = 0;
                while (col.scrollHeight > col.clientHeight + 2 && guard++ < 400) {
                    var items = Array.prototype.slice.call(col.querySelectorAll('.tech-item:not(.collapsed)'));
                    if (!items.length) break;
                    items.sort(function (a, b) { return (+a.dataset.prereqs) - (+b.dataset.prereqs); });
                    items[0].classList.add('collapsed');
                }
            });
        };
        // Wall-display helper: per visible tech card, grow the font (CSS var --tcfs) to the largest scale
        // that keeps the NAME on one line and the DESCRIPTION from overflowing the fixed-aspect card.
        // Binary-searched per card; runs after fitTechCols so it only sizes the still-shown (un-collapsed) cards.
        window.ti4.fitTechCardFonts = function () {
            var MIN = 0.7, MAX = 1.9, STEPS = 8;
            var apply = function () {
                document.querySelectorAll('.beamer .tech-item:not(.collapsed)').forEach(function (item) {
                    var card = item.querySelector('.techcard');
                    if (!card) return;
                    var name = item.querySelector('.tc-name');
                    var desc = item.querySelector('.tc-desc');
                    var fits = function (scale) {
                        item.style.setProperty('--tcfs', scale);
                        if (name && name.scrollWidth > name.clientWidth + 1) return false;       // name wrapped → too big
                        if (card.scrollHeight > card.clientHeight + 1) return false;              // card overflowed
                        if (desc && desc.scrollHeight > desc.clientHeight + 1) return false;      // desc overflowed its box (unit cards)
                        return true;
                    };
                    if (!fits(MIN)) { item.style.setProperty('--tcfs', MIN); return; }            // even smallest overflows → clip
                    var lo = MIN, hi = MAX;
                    for (var i = 0; i < STEPS; i++) {
                        var mid = (lo + hi) / 2;
                        if (fits(mid)) lo = mid; else hi = mid;
                    }
                    item.style.setProperty('--tcfs', lo);
                });
            };
            apply();
            // Re-fit once the web fonts (Orbitron name font) are ready — measuring against the fallback font
            // mis-sizes the one-line name check, letting a long name overflow once the real glyphs load in.
            if (document.fonts && document.fonts.status !== 'loaded') { document.fonts.ready.then(apply); }
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Register AFTER the page has loaded, and only where service workers exist at all.
        // Two reasons, both burned: at parse time the registration — and in a published build the worker's
        // own precache of EVERY asset, ~250 files — competes with the boot download for the browser's six
        // connections, which is a first-visit-only stall that a reload always appears to "fix". And on a
        // plain-HTTP LAN address `navigator.serviceWorker` is undefined, so the bare call threw a TypeError
        // on exactly the setup the wall display uses.
        if ('serviceWorker' in navigator) {
            addEventListener('load', async function () {
                try {
                    const reg = await navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
                    // A worker that is INSTALLED but waiting means a deploy has landed and this page is still
                    // being served the old app out of the cache. Tell the app so it can offer a reload — see
                    // UpdateNotice.razor. `controller` must exist: on a first visit there is a new worker too,
                    // and that is not an update, that is the app arriving.
                    const announce = function () {
                        if (!reg.waiting || !navigator.serviceWorker.controller) return;
                        window.ti4.update.waiting = true;
                        if (window.ti4.update.onFound) window.ti4.update.onFound();
                    };
                    announce();                       // it may have been waiting since an earlier visit
                    reg.addEventListener('updatefound', function () {
                        const sw = reg.installing;
                        if (sw) sw.addEventListener('statechange', function () { if (sw.state === 'installed') announce(); });
                    });
                } catch (e) { /* no offline support, no update notice — neither is fatal */ }
            });
        }
    </script>
</body>

</html>
