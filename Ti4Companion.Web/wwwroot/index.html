<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#070b16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TI4 Companion" />
    <title>Twilight Imperium Companion</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Ti4Companion.Web.styles.css" rel="stylesheet" />

    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Wall-display helper: shrink each tech card's description until it fits the fixed-height card
        // (down to minPx). Returns the data-tech ids of cards whose description STILL overflows at the min,
        // so Display.razor can re-render those as compact names. Cards have overflow:hidden + a fixed height,
        // so font-shrinking only affects whether the text clips — never the card size.
        window.ti4 = window.ti4 || {};
        window.ti4.fitTechCards = function (minPx) {
            var overflow = [], seen = {};
            document.querySelectorAll('.beamer .tech-col.cards .techcard.nonunit').forEach(function (card) {
                var desc = card.querySelector('.tc-desc');
                if (!desc) return;
                desc.style.fontSize = '';                                   // reset to the CSS clamp base
                var size = parseFloat(getComputedStyle(desc).fontSize) || 12, guard = 0;
                while (card.scrollHeight > card.clientHeight + 1 && size > minPx && guard++ < 60) {
                    size = Math.max(minPx, size - 0.5);
                    desc.style.fontSize = size + 'px';
                }
                if (card.scrollHeight > card.clientHeight + 1) {
                    var key = card.getAttribute('data-tech');
                    if (key && !seen[key]) { seen[key] = 1; overflow.push(key); }
                }
            });
            return overflow;
        };
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
