# Production stack for a single Linux host VM: PostgreSQL + API (serves the Blazor client) + Caddy (HTTPS).
# Copy .env.example to .env and fill in the values, then: docker compose up -d --build
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ti4db
      POSTGRES_USER: ${POSTGRES_USER:-ti4admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ti4admin} -d ti4db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Ti4Companion.ApiService/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ti4db: "Host=postgres;Port=5432;Database=ti4db;Username=${POSTGRES_USER:-ti4admin};Password=${POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
